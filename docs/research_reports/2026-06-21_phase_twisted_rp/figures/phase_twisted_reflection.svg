<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Phase-twisted reflection positivity criterion</title>
  <desc id="desc">A schematic comparing fixed reflection, explicit gauge transform, and phase-twisted reflection for the paired benchmark.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#344054"/>
    </marker>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 8; }
      .good { fill: #e8f7ef; stroke: #22a06b; }
      .warn { fill: #fff7df; stroke: #c4820f; }
      .ink { fill: #1f2937; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill: #667085; font-family: Arial, Helvetica, sans-serif; }
      .math { fill: #111827; font-family: "Times New Roman", serif; font-style: italic; }
      .arrow { stroke: #344054; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="24" y="24" width="1032" height="472" class="panel"/>
  <text x="54" y="68" class="ink" font-size="28" font-weight="700">Same Monte Carlo basis, different reflection choice</text>
  <text x="54" y="98" class="muted" font-size="17">The phase can be assigned to the reflection map instead of introduced as an explicit basis change.</text>

  <rect x="58" y="142" width="280" height="242" class="box"/>
  <text x="84" y="178" class="ink" font-size="20" font-weight="700">Fixed reflection</text>
  <text x="84" y="216" class="math" font-size="22">θ₀(b) = c</text>
  <text x="84" y="250" class="math" font-size="22">hΔ = −δτ Δ (b⁺c⁺ + bc)</text>
  <rect x="84" y="284" width="224" height="64" class="warn"/>
  <text x="102" y="311" class="ink" font-size="17">Cone block has</text>
  <text x="102" y="336" class="math" font-size="21">K = −δτ Δ I</text>

  <path d="M 348 260 C 405 260, 428 260, 486 260" class="arrow"/>
  <text x="374" y="236" class="muted" font-size="15">equivalent proof route</text>

  <rect x="502" y="142" width="244" height="242" class="box"/>
  <text x="528" y="178" class="ink" font-size="20" font-weight="700">Explicit gauge wording</text>
  <text x="528" y="216" class="math" font-size="22">ĉ = −c</text>
  <text x="528" y="250" class="math" font-size="22">hΔ = +δτ Δ (b⁺ĉ⁺ + bĉ)</text>
  <rect x="528" y="284" width="188" height="64" class="good"/>
  <text x="546" y="311" class="ink" font-size="17">RP block has</text>
  <text x="546" y="336" class="math" font-size="21">K = +δτ Δ I</text>

  <path d="M 746 260 C 792 260, 808 260, 856 260" class="arrow"/>
  <text x="766" y="236" class="muted" font-size="15">cleaner criterion</text>

  <rect x="872" y="142" width="150" height="242" class="box good"/>
  <text x="900" y="178" class="ink" font-size="20" font-weight="700">Phase reflection</text>
  <text x="902" y="216" class="math" font-size="22">θη(b) = η c</text>
  <text x="902" y="250" class="math" font-size="22">η = −1</text>
  <text x="902" y="296" class="math" font-size="22">hΔ = K X θη(X)</text>
  <text x="902" y="330" class="math" font-size="22">K = δτ Δ I ≥ 0</text>

  <text x="76" y="444" class="ink" font-size="18" font-weight="700">Recommended manuscript logic:</text>
  <text x="324" y="444" class="ink" font-size="18">define RP with an arbitrary phase isomorphism between the two bosonic halves; choose η = −1 for the paired benchmark.</text>
</svg>
